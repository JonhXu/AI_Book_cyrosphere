services:
  - type: web
    name: ai-book-cyrosphere-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: APP_DATABASE_PATH
        value: /app/data/seed/app.db
